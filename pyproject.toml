[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argoshot"
version = "0.1.0"
description = "Official client for the Argoshot screenshot API: screenshots, PDFs and signed og:image URLs of any web page or HTML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Argoshot" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["argoshot", "screenshot", "screenshot-api", "html-to-image", "pdf", "og-image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://argoshot.com"
Documentation = "https://argoshot.com/docs"
Repository = "https://github.com/rrlabs-io/argoshot-python"

[tool.hatch.build]
# (the repository's root .gitignore ignores any path named "argoshot": do not let it drop the package)
ignore-vcs = true
exclude = ["dist", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["src/argoshot", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/argoshot"]
